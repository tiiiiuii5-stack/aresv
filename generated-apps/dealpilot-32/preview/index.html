<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>DealPilot 32</title><style>:root{--surface:#f6f8fb;--primary:#155e75;--accent:#22c55e;--ink:#0f172a}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 20px;background:rgba(255,255,255,.92);border-bottom:1px solid #e2e8f0;backdrop-filter:blur(14px)}nav{display:flex;gap:8px;overflow:auto}button,nav a{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;text-decoration:none}nav a{background:#e2e8f0;color:#334155}.active,#submit{background:var(--primary)!important;color:white}.hero{max-width:1180px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:minmax(0,1fr)340px;gap:18px}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:22px;box-shadow:0 18px 45px rgba(15,23,42,.08)}h1{font-size:clamp(34px,5vw,58px);line-height:1;margin:8px 0}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:900;color:var(--primary)}.kanban-board{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));}.card,.event{background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;padding:14px}.value{font-size:28px;font-weight:850;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button:first-child{background:var(--primary);color:white}.actions button:last-child{background:#fee2e2;color:#991b1b}textarea{width:100%;min-height:120px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}#submit{width:100%;margin-top:10px}.event{margin-top:10px;color:#047857}@media(max-width:840px){.hero{grid-template-columns:1fr}.kanban-board{grid-template-columns:1fr!important}header{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="app"><header><strong>DealPilot 32</strong><nav id="nav"></nav></header><section class="hero"><div class="panel"><p class="eyebrow">crm runtime</p><h1>DealPilot 32</h1><p>Build isolated local test CRM for sales managers where users create clients, move deals, assign tasks, and save activity history. unique architecture variant 32</p><div id="records" class="kanban-board"></div></div><aside class="panel"><h2>Create crm event</h2><textarea id="input" placeholder="Name, Owner, State, Score"></textarea><button id="submit" data-action="create" data-api="/api/projects/f2dc5f1a-4707-4dac-92bf-8ccd72c47748/runtime" data-db-change="insert-record" data-state-update="records=data.state.records" data-ui-refresh="render">move deal</button><div id="events"></div></aside></section></main>
<script>
const projectId="f2dc5f1a-4707-4dac-92bf-8ccd72c47748";const views=["Command","Queue","Rules","Insights"];const statusFlow=["Lead","In Progress","Review","Done"];const transitionLabel="Advance variant 32 state";const deleteLabel="Remove variant 32 audit";let records=[{"id":"crm-1","label":"DealPilot 32 queue item","value":"96 open","status":"Queued","meta":"Variant 32 command queue"},{"id":"crm-2","label":"DealPilot 32 rule set","value":"36 rules","status":"Active","meta":"Variant 32 rule builder","parentId":"crm-1"},{"id":"crm-3","label":"DealPilot 32 insight","value":"122%","status":"Healthy","meta":"Variant 32 event timeline","parentId":"crm-1"}];let active=views[0];const nav=document.getElementById("nav");const root=document.getElementById("records");const events=document.getElementById("events");const input=document.getElementById("input");
async function load(){try{const res=await fetch("/api/projects/"+projectId+"/runtime");if(res.ok){const data=await res.json();records=data.state.records||records;log("Loaded isolated runtime state");}}catch(error){log("Runtime API unavailable; using bundled state");}render();}
function render(){nav.innerHTML="";views.forEach(view=>{const b=document.createElement("a");b.href="#"+view;b.textContent=view;b.className=view===active?"active":"";b.onclick=(event)=>{event.preventDefault();active=view;log("Opened "+view);render();};nav.appendChild(b)});root.innerHTML="";records.forEach(record=>{const card=document.createElement("article");card.className="card";card.innerHTML="<strong>"+record.label+"</strong><div class='value'>"+record.value+"</div><span>"+record.status+"</span><div class='actions'><button data-action='transition' data-api='/api/projects/"+projectId+"/runtime' data-db-change='update-status' data-state-update='records=data.state.records' data-ui-refresh='render' data-id='"+record.id+"'>"+transitionLabel+"</button><button data-action='delete' data-api='/api/projects/"+projectId+"/runtime' data-db-change='delete-record' data-state-update='records=data.state.records' data-ui-refresh='render' data-id='"+record.id+"'>"+deleteLabel+"</button></div>";card.onclick=()=>log("Selected "+record.label);card.querySelector("[data-action='transition']").onclick=(event)=>{event.stopPropagation();mutate({action:"transition",id:record.id});};card.querySelector("[data-action='delete']").onclick=(event)=>{event.stopPropagation();mutate({action:"delete",id:record.id});};root.appendChild(card);});}
function log(message){const item=document.createElement("div");item.className="event";item.textContent=message;events.prepend(item);}
async function mutate(payload){const res=await fetch("/api/projects/"+projectId+"/runtime",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({type:"move deal",...payload})});if(res.ok){const data=await res.json();records=data.state.records;log("Runtime mutation persisted: "+(payload.action||"create"));render();}else if(payload.action==="transition"){records=records.map(record=>record.id===payload.id?{...record,status:statusFlow[Math.min(statusFlow.indexOf(record.status)+1,statusFlow.length-1)]||"Done"}:record);log("Transition saved locally");render();}else if(payload.action==="delete"){records=records.filter(record=>record.id!==payload.id&&record.parentId!==payload.id);log("Delete saved locally");render();}}
document.getElementById("submit").onclick=async()=>{const label=input.value.trim()||"move deal";await mutate({action:"create",label,value:"New",status:statusFlow[0]||"Created"});input.value="";};
load();
</script></body></html>
