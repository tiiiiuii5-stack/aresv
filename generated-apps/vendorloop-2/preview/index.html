<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>VendorLoop</title><style>:root{--surface:#f5f3ff;--primary:#6d28d9;--accent:#14b8a6;--ink:#1e1b4b}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 20px;background:rgba(255,255,255,.92);border-bottom:1px solid #e2e8f0;backdrop-filter:blur(14px)}nav{display:flex;gap:8px;overflow:auto}button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}nav button{background:#e2e8f0}.active,#submit{background:var(--primary)!important;color:white}.hero{max-width:1180px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:minmax(0,1fr)340px;gap:18px}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:22px;box-shadow:0 18px 45px rgba(15,23,42,.08)}h1{font-size:clamp(34px,5vw,58px);line-height:1;margin:8px 0}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:900;color:var(--primary)}.market-grid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));}.card,.event{background:#f8fafc;border:1px solid #e2e8f0;border-radius:13px;padding:14px}.value{font-size:28px;font-weight:850;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button:first-child{background:var(--primary);color:white}.actions button:last-child{background:#fee2e2;color:#991b1b}textarea{width:100%;min-height:120px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}#submit{width:100%;margin-top:10px}.event{margin-top:10px;color:#047857}@media(max-width:840px){.hero{grid-template-columns:1fr}.market-grid{grid-template-columns:1fr!important}header{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="app"><header><strong>VendorLoop</strong><nav id="nav"></nav></header><section class="hero"><div class="panel"><p class="eyebrow">marketplace runtime</p><h1>VendorLoop</h1><p>Build a marketplace where buyers send inquiries to sellers, sellers manage listings, and admins resolve transactions 1780202394200.</p><div id="records" class="market-grid"></div></div><aside class="panel"><h2>Buyer inquiry</h2><textarea id="input" placeholder="Need, Budget, Timeline"></textarea><button id="submit">send inquiry</button><div id="events"></div></aside></section></main>
<script>
const projectId="4da8b811-ce97-4a54-a9e7-ebd72bac775e";const views=["Marketplace","Listings","Seller","Checkout"];const statusFlow=["Top rated","Fast reply","Verified","In Progress","Done"];const transitionLabel="Qualify inquiry";const deleteLabel="Remove listing";let records=[{"id":"marketplace-1","label":"Verified design partner","value":"$2.4k","status":"Top rated","meta":"Listing search"},{"id":"marketplace-2","label":"Ops automation pack","value":"$899","status":"Fast reply","meta":"Seller cards","parentId":"marketplace-1"},{"id":"marketplace-3","label":"Launch advisor","value":"$150/hr","status":"Verified","meta":"Trust scoring","parentId":"marketplace-1"}];let active=views[0];const nav=document.getElementById("nav");const root=document.getElementById("records");const events=document.getElementById("events");const input=document.getElementById("input");
async function load(){try{const res=await fetch("/api/projects/"+projectId+"/runtime");if(res.ok){const data=await res.json();records=data.state.records||records;log("Loaded isolated runtime state");}}catch(error){log("Runtime API unavailable; using bundled state");}render();}
function render(){nav.innerHTML="";views.forEach(view=>{const b=document.createElement("button");b.textContent=view;b.className=view===active?"active":"";b.onclick=()=>{active=view;log("Opened "+view);render();};nav.appendChild(b)});root.innerHTML="";records.forEach(record=>{const card=document.createElement("article");card.className="card";card.innerHTML="<strong>"+record.label+"</strong><div class='value'>"+record.value+"</div><span>"+record.status+"</span><div class='actions'><button data-action='transition' data-id='"+record.id+"'>"+transitionLabel+"</button><button data-action='delete' data-id='"+record.id+"'>"+deleteLabel+"</button></div>";card.onclick=()=>log("Selected "+record.label);card.querySelector("[data-action='transition']").onclick=(event)=>{event.stopPropagation();mutate({action:"transition",id:record.id});};card.querySelector("[data-action='delete']").onclick=(event)=>{event.stopPropagation();mutate({action:"delete",id:record.id});};root.appendChild(card);});}
function log(message){const item=document.createElement("div");item.className="event";item.textContent=message;events.prepend(item);}
async function mutate(payload){const res=await fetch("/api/projects/"+projectId+"/runtime",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({type:"send inquiry",...payload})});if(res.ok){const data=await res.json();records=data.state.records;log("Runtime mutation persisted: "+(payload.action||"create"));render();}else if(payload.action==="transition"){records=records.map(record=>record.id===payload.id?{...record,status:statusFlow[Math.min(statusFlow.indexOf(record.status)+1,statusFlow.length-1)]||"Done"}:record);log("Transition saved locally");render();}else if(payload.action==="delete"){records=records.filter(record=>record.id!==payload.id&&record.parentId!==payload.id);log("Delete saved locally");render();}}
document.getElementById("submit").onclick=async()=>{const label=input.value.trim()||"send inquiry";await mutate({action:"create",label,value:"New",status:statusFlow[0]||"Created"});input.value="";};
load();
</script></body></html>
