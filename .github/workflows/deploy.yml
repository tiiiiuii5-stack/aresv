name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployment-id: ${{ steps.deploy.outputs.deployment-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Verify env vars required
        run: |
          node scripts/verify-env.mjs
        env:
          NODE_ENV: production
          # Provide dummy values for verification
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING || 'dummy' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: vercel/action@v6
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to become healthy..."
          for i in {1..30}; do
            if curl -f -s https://ventureos-full-fixed.vercel.app/api/health > /dev/null 2>&1; then
              echo "✓ Deployment healthy"
              exit 0
            fi
            echo "Health check attempt $i/30..."
            sleep 10
          done
          echo "✗ Deployment did not become healthy"
          exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "✓ Production deployment successful"
          echo "Deployed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "✗ Deployment failed - consider rollback"
          echo "Revert last commit and push to trigger rollback"
